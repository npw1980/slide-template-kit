<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>value-chain-3box — Three-Box Value Chain with Stage Callouts (1280×720)</title>
<!--
  ============================================================================
  TEMPLATE  value-chain-3box  ·  family value-chain
  Evidence (see MANUAL.md -> SOURCE):
    pwc_strategy__pwc_copernicus_market_report_2019 (sheets s03-s08): the
      "value chain 3-box" page that repeats in every sector chapter of the
      deck — three stage boxes (Acquiring / Processing / Users) + callouts,
      page grammar (navy title band + blue subtitle + icon disc, numbered
      callout stack, bottom challenge strip). Review:
      reviews/pwc_strategy__pwc_copernicus_market_report_2019.md §5, §53.
    Palette hexes sampled from the review's colour system: navy #1F3864,
      mid-blue #1E5A90, light blue #A8C8E8, greys.
  ----------------------------------------------------------------------------
  SCALING: zero JS. html{font-size:...} maps 1rem == 1 STAGE PIXEL, so every
  length below is a 1:1 stage-pixel coordinate with the numbers MANUAL.md
  quotes. Diagram = ONE full-stage inline SVG.
  ----------------------------------------------------------------------------
  DIAGRAM: stage boxes live in <g id="stage-1..3"> placed by ONE translate
  each; internals are in local (0,0)-(357,116) coords. Bullet, bar and
  challenge groups share the SAME x anchors (64 / 461 / 857, w 357) so a
  4th stage is one translate + narrowed widths. See MANUAL.md FILL §4.
  ============================================================================
-->
<style>
  /* ============================ tokens ============================
     ONE accent (mid-blue) + ink navy + gray ramp; light blue is used ONLY
     as a pale fill behind dark text (a lightness of accent), never for text.
     Measured contrast on white:
       --ink #1F3864   text             = 11.6:1
       --accent #1E5A90 text            =  7.2:1
       --gray-2 #464646 body/notes      =  9.4:1
       --gray-3 #7D7D7D source line     =  4.1:1  -> 10px+ only, footnotes
       white on --ink chip              = 11.6:1
     ================================================================= */
  :root{
    --bg:      #FFFFFF;
    --ink:     #1F3864;   /* navy: title, stage names, chips          */
    --accent:  #1E5A90;   /* THE emphasis color — marks binding stage  */
    --accent-1:#D8E6F5;   /* ONE lightness of accent: pale fill only   */
    --gray-1:  #2D2D2D;
    --gray-2:  #464646;   /* body, bullets, non-binding stage bars     */
    --gray-3:  #7D7D7D;   /* source line, captions                     */
    --gray-4:  #F1F4F8;   /* band + panel fill                         */
    --gray-5:  #B9C4CE;   /* bar track / dimmed fill                   */
    --rule:    #C9CFD4;   /* hairlines                                 */
  }
  html{ font-size: min(calc(100vw / 1280), calc(100vh / 720)); }  /* 1rem = 1 stage px */
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#3A3F44; }
  .stage{
    position:relative; width:1280rem; height:720rem; margin:auto;
    background:var(--bg); overflow:hidden;
    font-family:"Helvetica Neue", Arial, Calibri, sans-serif;
  }

  /* ---------------- header band (HTML layer) ---------------- */
  .band{
    position:absolute; left:64rem; top:36rem; width:1152rem; height:106rem;
    background:var(--gray-4);
  }
  .band .title{
    position:absolute; left:28rem; top:14rem; width:1020rem;
    font-size:25rem; line-height:31rem; font-weight:700; color:var(--ink);
    letter-spacing:-.01em;
  }
  .band .title sup{ font-size:14rem; font-weight:700; color:var(--gray-2); }
  .band .sub{
    position:absolute; left:28rem; top:80rem; width:1020rem;
    font-size:12rem; line-height:14rem; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:var(--accent);
  }
  .band .icon{ position:absolute; right:22rem; top:26rem; }

  /* ---------------- stage text under the chain (HTML layer) ---------------- */
  .stagetext{ position:absolute; }  /* each block left/top set inline; bullets are SVG */

  /* ---------------- footer ---------------- */
  .foot{
    position:absolute; left:0; bottom:0; width:1280rem; height:56rem;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 64rem; border-top:1px solid var(--rule);
  }
  .foot .src{ font-size:9.5rem; color:var(--gray-3); }
  .foot .src sup{ font-size:7.5rem; }
  .foot .pg{ font-size:10rem; font-weight:700; color:var(--gray-2); letter-spacing:.06em; }

  /* full-stage diagram layer */
  svg.fig{ position:absolute; left:0; top:0; width:1280rem; height:720rem; display:block; }
</style>
</head>
<body>
<div class="stage">

  <!-- ================= HEADER BAND ================= -->
  <div class="band">
    <h1 class="title">Value sits downstream: processing and user services capture 67%<sup>1</sup> of the EO-data margin pool</h1>
    <div class="sub">Acquisition is the cheapest box &mdash; and the only one that is openly licensed</div>
    <svg class="icon" width="56rem" height="56rem" viewBox="0 0 56 56" aria-hidden="true">
      <!-- satellite-over-orbit mark, drawn: 3 earth dots + orbit arc + s/c -->
      <circle cx="28" cy="28" r="26" fill="#FFFFFF" stroke="var(--rule)" stroke-width="1.4"/>
      <path d="M14 34 A 18 14 0 1 0 42 22" fill="none" stroke="var(--gray-5)" stroke-width="2"/>
      <circle cx="21" cy="31" r="2.6" fill="var(--gray-3)"/>
      <circle cx="29" cy="25" r="2.6" fill="var(--accent)"/>
      <circle cx="34" cy="33" r="2.6" fill="var(--gray-3)"/>
      <rect x="40.5" y="16.5" width="7" height="5" rx="1" fill="var(--ink)" transform="rotate(18 44 19)"/>
    </svg>
  </div>

  <!-- ================= DIAGRAM LAYER ================= -->
  <svg class="fig" viewBox="0 0 1280 720" font-family="'Helvetica Neue', Arial, sans-serif">

    <!-- ---- stage boxes: one group each, one translate each ---- -->
    <g id="stage-1" transform="translate(64,164)">
      <rect width="357" height="116" fill="var(--gray-4)" stroke="var(--rule)" stroke-width="1"/>
      <circle cx="24" cy="26" r="12" fill="var(--gray-3)"/>
      <text x="24" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
      <text x="46" y="31" font-size="15" font-weight="700" letter-spacing=".06em" fill="var(--ink)">DATA ACQUISITION</text>
      <text x="24" y="60" font-size="11" font-style="italic" fill="var(--gray-2)">Sentinel satellites, in-situ sensors,</text>
      <text x="24" y="76" font-size="11" font-style="italic" fill="var(--gray-2)">drone surveys &mdash; open licence, no</text>
      <text x="24" y="92" font-size="11" font-style="italic" fill="var(--gray-2)">marginal cost per use.</text>
    </g>
    <g id="stage-2" transform="translate(461,164)">
      <rect width="357" height="116" fill="var(--gray-4)" stroke="var(--rule)" stroke-width="1"/>
      <circle cx="24" cy="26" r="12" fill="var(--gray-3)"/>
      <text x="24" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
      <text x="46" y="31" font-size="15" font-weight="700" letter-spacing=".06em" fill="var(--ink)">DATA PROCESSING</text>
      <text x="24" y="60" font-size="11" font-style="italic" fill="var(--gray-2)">Fusion, calibration, value-add</text>
      <text x="24" y="76" font-size="11" font-style="italic" fill="var(--gray-2)">analytics &mdash; needs domain SMEs</text>
      <text x="24" y="92" font-size="11" font-style="italic" fill="var(--gray-2)">and cloud-scale compute.</text>
    </g>
    <g id="stage-3" transform="translate(857,164)">
      <!-- binding stage: accent left edge instead of plain fill -->
      <rect width="357" height="116" fill="var(--accent-1)" stroke="var(--accent)" stroke-width="1.4"/>
      <circle cx="24" cy="26" r="12" fill="var(--accent)"/>
      <text x="24" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
      <text x="46" y="31" font-size="15" font-weight="700" letter-spacing=".06em" fill="var(--ink)">USER SERVICES</text>
      <text x="24" y="60" font-size="11" font-style="italic" fill="var(--gray-2)">Advisory, monitoring dashboards,</text>
      <text x="24" y="76" font-size="11" font-style="italic" fill="var(--gray-2)">insurance products &mdash; closest to</text>
      <text x="24" y="92" font-size="11" font-style="italic" fill="var(--gray-2)">budget holders, recurring revenue.</text>
    </g>

    <!-- ---- flow arrows (gutters 421-461 / 817-857) ---- -->
    <g id="arrows" fill="var(--gray-5)">
      <polygon points="432,214 456,229 432,244"/>
      <polygon points="828,214 852,229 828,244"/>
    </g>

    <!-- ---- stage bullets: same x anchors as stage boxes ---- -->
    <g id="bullets-1" transform="translate(64,300)">
      <rect x="0" y="1" width="5" height="5" fill="var(--gray-5)"/>
      <text x="14" y="7" font-size="11" fill="var(--gray-2)">Copernicus programme + national missions</text>
      <rect x="0" y="21" width="5" height="5" fill="var(--gray-5)"/>
      <text x="14" y="27" font-size="11" fill="var(--gray-2)">Commodity suppliers, not consultancies</text>
      <rect x="0" y="41" width="5" height="5" fill="var(--gray-5)"/>
      <text x="14" y="47" font-size="11" fill="var(--gray-2)">Entry price is set by policy, not by clients</text>
    </g>
    <g id="bullets-2" transform="translate(461,300)">
      <rect x="0" y="1" width="5" height="5" fill="var(--gray-5)"/>
      <text x="14" y="7" font-size="11" fill="var(--gray-2)">Few integrators, quality is the differentiator</text>
      <rect x="0" y="21" width="5" height="5" fill="var(--gray-5)"/>
      <text x="14" y="27" font-size="11" fill="var(--gray-2)">Accuracy errors travel into every client call</text>
      <rect x="0" y="41" width="5" height="5" fill="var(--gray-5)"/>
      <text x="14" y="47" font-size="11" fill="var(--gray-2)">Funding is project-by-project, rarely retained</text>
    </g>
    <g id="bullets-3" transform="translate(857,300)">
      <rect x="0" y="1" width="5" height="5" fill="var(--accent)"/>
      <text x="14" y="7" font-size="11" fill="var(--gray-2)">Farmers, agencies and insurers hold the budget</text>
      <rect x="0" y="21" width="5" height="5" fill="var(--accent)"/>
      <text x="14" y="27" font-size="11" fill="var(--gray-2)">Lock-in comes from domain interpretation only</text>
      <rect x="0" y="41" width="5" height="5" fill="var(--accent)"/>
      <text x="14" y="47" font-size="11" fill="var(--gray-2)">Recurring contracts beat one-off data sales</text>
    </g>

    <!-- ---- value-capture bars: grey ramp, binding stage in accent ---- -->
    <g id="value-bars" transform="translate(64,392)">
      <text x="0" y="-10" font-size="10" font-weight="700" letter-spacing=".08em" fill="var(--gray-3)">SHARE OF MARGIN POOL, INDICATIVE<tspan baseline-shift="super" font-size="7.5">1</tspan></text>
      <!-- stage 1: 15% -->
      <rect x="0" y="2" width="357" height="9" fill="var(--gray-5)"/>
      <rect x="0" y="2" width="54" height="9" fill="var(--gray-3)"/>
      <text x="62" y="11" font-size="11.5" font-weight="700" fill="var(--gray-2)">15%</text>
      <!-- stage 2: 35% -->
      <rect x="397" y="2" width="357" height="9" fill="var(--gray-5)"/>
      <rect x="397" y="2" width="125" height="9" fill="var(--gray-3)"/>
      <text x="530" y="11" font-size="11.5" font-weight="700" fill="var(--gray-2)">35%</text>
      <!-- stage 3: 50% (binding = accent) -->
      <rect x="794" y="2" width="357" height="9" fill="var(--gray-5)"/>
      <rect x="794" y="2" width="179" height="9" fill="var(--accent)"/>
      <text x="981" y="11" font-size="11.5" font-weight="700" fill="var(--ink)">50%</text>
    </g>

    <line x1="64" y1="464" x2="1216" y2="464" stroke="var(--rule)" stroke-width="1"/>

    <!-- ---- challenge strip: 3 columns, same x anchors ---- -->
    <g id="challenges" font-size="11" fill="var(--gray-2)">
      <text x="64" y="500" font-size="11.5" font-weight="700" letter-spacing=".06em" fill="var(--ink)">CHALLENGE 1</text>
      <text x="64" y="522">Fragmented standards across member states</text>
      <text x="64" y="538">complicate cross-border resale of open data.</text>

      <text x="461" y="500" font-size="11.5" font-weight="700" letter-spacing=".06em" fill="var(--ink)">CHALLENGE 2</text>
      <text x="461" y="522">Open data is free; quality is not &mdash; errors</text>
      <text x="461" y="538">travel directly into client decisions.</text>

      <text x="857" y="500" font-size="11.5" font-weight="700" letter-spacing=".06em" fill="var(--ink)">CHALLENGE 3</text>
      <text x="857" y="522">Service margins compress as dashboards</text>
      <text x="857" y="538">commoditise; only interpretation holds price.</text>
    </g>

    <text x="64" y="612" font-size="9.5" fill="var(--gray-3)"><tspan font-weight="700">1</tspan> Stage economics are an illustrative construct built from the chapter service taxonomy, not measured margins. Sources: national space programmes; ESA; PwC analysis.</text>
  </svg>

  <!-- ================= FOOTER ================= -->
  <div class="foot">
    <div class="src">Copernicus Market Report&thinsp;|&thinsp;Issue 2, February 2019&thinsp;|&thinsp;Prepared by PwC<sup>1</sup></div>
    <div class="pg">1&thinsp;|&thinsp;VALUE CHAIN</div>
  </div>

</div>
</body>
